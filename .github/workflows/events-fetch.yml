name: Fetch Events

on:
  workflow_dispatch:        # manual trigger only — Eventbrite blocked in Actions, run update.bat locally

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch events and write events.json
        run: python events_fetch.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet && echo "No changes." || (
            git commit -m "chore: update events.json [skip ci]"
            git push
          )
